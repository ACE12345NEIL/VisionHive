<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VisionHive</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="/frontend/styles.css"></head><body>
<header><div><span class="mark">VH</span><strong>VisionHive</strong></div><span id="status">Connecting</span></header>
<main>

<section class="environment-panel">
<form id="location-form"><input id="location-query" placeholder="Site location, e.g. Pune, India" required><button>Set</button></form>
<div class="environment-actions"><button id="weather-refresh" type="button">Refresh weather</button><button id="indoor-load" type="button">Indoor dataset</button></div>
<div id="environment-status">No location set.</div>
</section>

<div class="grid">

<section class="camera-panel">
<h2>Cameras</h2>
<div id="cameras" class="empty">Awaiting camera streams…</div>
</section>

<aside class="side">
<section class="fusion-panel">
<h2>Fused occupancy</h2>
<div id="fusion-status">No cross-camera overlap configured.</div>
</section>

<article class="zones-panel">
<h2>Zones</h2>
<div id="zones" class="zones"></div>
</article>
</aside>

</div>
</main>
<script src="/frontend/app.js"></script></body></html>
